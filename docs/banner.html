<!doctype html>
<!-- The README banner. Rendered to banner.png at 1680x600 (840x300 at 2x):
     chromium --headless=new --window-size=840,300 --force-device-scale-factor=2 --screenshot=banner.png banner.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 840px; height: 300px; overflow: hidden; background: #0f1113; color: #eef2f5; font-family: "Archivo", sans-serif; }
  .frame {
    position: relative; width: 840px; height: 300px; padding: 44px 52px;
    display: flex; flex-direction: column; justify-content: space-between;
    background:
      radial-gradient(520px 300px at 86% 50%, rgba(70, 217, 138, .18), transparent 70%),
      linear-gradient(#16191c, #0f1113);
    border: 1px solid #242a2f; border-radius: 20px;
  }
  .lockup { display: flex; align-items: center; gap: 22px; }
  .tile { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 17px; background: #46d98a; color: #04150c; }
  .tile svg { width: 72%; height: 72%; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; }
  .word { font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -0.01em; }
  .for { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border: 1px solid #2b3238; border-radius: 999px; background: #16191c; color: #b3bcc4; font: 500 14px/1 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  .for b { color: #46d98a; font-weight: 500; margin-left: 6px; }
  .word b { color: #46d98a; font-weight: 700; }
  .join { color: #7c868f; font: 500 15px/1 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  .line { max-width: 430px; color: #b3bcc4; font-size: 21px; line-height: 1.35; }
  .line strong { color: #eef2f5; font-weight: 650; }
  .screen { position: absolute; right: 54px; top: 30px; width: 240px; height: 240px; border-radius: 50%;
            box-shadow: 0 0 0 7px #1b1f23, 0 0 0 8px #2b3238, 0 24px 60px rgba(0, 0, 0, .55), 0 0 60px rgba(70, 217, 138, .18); }
  .screen img { display: block; width: 100%; height: 100%; border-radius: 50%; }
</style>
</head>
<body>
  <div class="frame">
    <div class="lockup">
      <span class="tile"><svg viewBox="0 0 24 24"><path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 3v18"/><path d="M16 7v10"/><path d="M20 10v4"/></svg></span>
      <span class="word">air<b>drift</b></span>
      <span class="for">for<b>ESP32-S3</b></span>
    </div>
    <p class="line"><strong>A little radio for the whole world.</strong> Free internet radio from 60,000 stations on a board the size of a coaster, with a round touch screen or a knob and two speakers.</p>
    <div class="screen"><img src="screenshots/screen-home.png" alt=""></div>
  </div>
</body>
</html>
