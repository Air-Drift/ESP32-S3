; Air Drift for ESP32-S3: an internet radio that reads airdrift.stream's
; station directory and plays a station through an I2S DAC.
;
; Two builds share all the radio code:
;
;   pio run -e devkit -t upload          the custom build: a DevKitC on a
;                                        breadboard with a PCM5102A DAC, an
;                                        amplifier, a knob and buttons
;   pio run -e waveshare-185 -t upload  the self-contained unit: Waveshare
;                                        ESP32-S3-Touch-LCD-1.85, with its round
;                                        touch screen and speaker
;   pio device monitor                   serial console, 115200
;
; Pins and defaults per board live in include/config.h.

[platformio]
default_envs = devkit

[env]
; pioarduino keeps the Arduino core at 3.x (ESP-IDF 5), which the audio
; library needs; the stock espressif32 platform is stuck on core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600
; 8 MB layout boots on 8 MB and 16 MB flash alike.
board_build.partitions = default_8MB.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
lib_deps =
  https://github.com/schreibfaul1/ESP32-audioI2S.git
  bblanchon/ArduinoJson@^7.4.2
  tzapu/WiFiManager@^2.0.17

; ---- The custom build. The audio library needs PSRAM; most DevKitC clones
; with a CH343 USB chip are N16R8 (octal PSRAM). Serial is on the UART chip.
[env:devkit]
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DBOARD_DEVKIT=1 -DARDUINO_USB_CDC_ON_BOOT=0 -DAD_ENV=\"devkit\"

; Same, for a board with quad PSRAM (N8R2, N4R2). To find out which you have:
;   pio pkg exec -- esptool.py --port /dev/ttyACM0 flash_id
[env:devkit-quad]
board_build.arduino.memory_type = qio_qspi
build_flags = ${env.build_flags} -DBOARD_DEVKIT=1 -DARDUINO_USB_CDC_ON_BOOT=0 -DAD_ENV=\"devkit-quad\"

; ---- Waveshare ESP32-S3-Touch-LCD-1.85: ESP32-S3R8 (octal PSRAM), 16 MB
; flash, 360x360 round ST77916 screen, CST816 touch, PCM5101 DAC and a
; speaker amplifier. Serial is the chip's own USB port.
[env:waveshare-185]
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DBOARD_WAVESHARE_185=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DAD_ENV=\"waveshare-185\"
lib_deps =
  ${env.lib_deps}
  https://github.com/moononournation/Arduino_GFX.git#v1.6.9
  olikraus/U8g2
  ricmoo/QRCode@^0.0.1
  bitbank2/JPEGDEC@^1.8.2
  bitbank2/PNGdec@^1.1.0
